name: Daily Stock Report 10pm

on:
  schedule:
    - cron: '0 22 * * *'  # Every day at 10:00 PM UTC
  workflow_dispatch:        # Allow manual trigger from GitHub

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run daily stock report
        run: python stock_scout_daily.py
